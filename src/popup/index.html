<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Ponto Automático</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <h1><span id="name"></span><small id="version"></small></h1>
      <time id="date"></time>
      <button id="automation" type="button" role="switch" aria-checked="false" disabled>
        Automação: carregando…
      </button>
      <p id="automation-error" role="alert"></p>
    </header>
    <ol id="timeline"></ol>
    <p id="plan-status" role="status"></p>
    <p id="read-status" role="status"></p>
    <footer>
      <p id="observed"></p>
      <button id="refresh" type="button">Atualizar</button>
    </footer>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
