name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: ${{ !startsWith(gitea.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(gitea.ref, 'refs/tags/v')
    permissions:
      code: read
      releases: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package extension
        working-directory: dist
        run: zip -r ../ponto-automatico-chrome.zip .

      - name: Publish release attachment
        env:
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: bash .gitea/scripts/publish-release.sh
